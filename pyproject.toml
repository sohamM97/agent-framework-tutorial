[project]
name = "agents-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agent-framework>=1.21",
    "agent-framework-core>=1.21",
    "agent-framework-devui>=1.0.0b261008",
    "graphviz>=0.21",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[tool.uv]
# Claude: agent-framework>=1.21 needs azure-ai-contentunderstanding>=1.2.0b2,
# which has a stable 1.0.x but no stable 1.2 yet. By default uv refuses a beta
# when a stable release exists. With this setting uv takes a beta only when a
# package has nothing but betas (many agent-framework-* packages, e.g. devui) or
# when a requirement names a beta, as the constraint below does.
prerelease = "if-necessary-or-explicit"
constraint-dependencies = ["azure-ai-contentunderstanding>=1.2.0b2"]

[tool.ruff.lint]
# I = isort (import sorting); extends ruff's defaults (F + E4/E7/E9)
extend-select = ["I", "E501"]
# Still flag unused imports, but don't auto-delete them on save
unfixable = ["F401"]
